services:
  metrics_service:
    build:
      context: ./metrics
      dockerfile: Dockerfile
    ports:
      - "9095:9095"
    user: "1000:3000"
    networks:
      - scraper_network

  scraper_service:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    user: "1000:3000"
    environment:
      - METRICS_SERVICE_URL=http://metrics_service:9095/increment
    networks:
      - scraper_network

  scraper_requester:
    build:
      context: ./scraper_requester
      dockerfile: Dockerfile
    container_name: scraper_requester
    user: "1000:3000"
    environment:
      - SCRAPER_SERVICE_URL=http://scraper_service:8080
      - REQUEST_INTERVAL=15
    networks:
      - scraper_network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # Mount your Prometheus configuration file
    networks:
      - scraper_network

networks:
  scraper_network:
    driver: bridge
